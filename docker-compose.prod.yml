services:
  db:
    image: postgres:15-alpine
    container_name: prod_postgres_db
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=config
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=change_this_to_a_complex_random_string_in_production_123!
    ports:
      - "5432:5432"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod_django_backend
    # Uses gunicorn running across multiple worker threads instead of development runserver
    command: >
      sh -c "python manage.py migrate &&
             gunicorn gift_of_presents.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=generate-a-secure-random-long-hash-key-for-production-environment
      - DB_HOST=db
      - DB_NAME=config
      - DB_USER=postgres_user
      - DB_PASSWORD=change_this_to_a_complex_random_string_in_production_123!
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=https://yourfrontenddomain.com
    depends_on:
      - db
    restart: always

volumes:
  prod_postgres_data:
