name: Unified Monorepo CI/CD Pipeline
run-name: ${{ github.actor }} - monorepo-pipeline - ${{ github.sha }}

on:
  push:
    branches: ["main", "dev", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # =========================================================================
  # 1. FRONTEND WORKFLOW PIPELINE
  # =========================================================================

  frontend-ci:
    name: Frontend Lint & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # Save the build artifact so we don't have to compile it twice
      - name: Upload Compiled Frontend Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 1

  frontend-deploy:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: frontend-ci
    # Safety Constraint: Only deploy to GitHub Pages on actual merges/pushes to develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Download the pre-built dist folder directly from the CI validation phase
      - name: Download Compiled Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist-delivery

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-delivery

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =========================================================================
  # 2. BACKEND WORKFLOW PIPELINE
  # =========================================================================

  backend-validate-and-deploy:
    name: Backend Test & AWS Cloud Deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Test Suites
        run: npm test

      - name: Set Deployment Target Stage
        id: set-stage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Skipping AWS infrastructure changes for PR validation stage."
            echo "deploy=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "stage=prod" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/dev" ] || [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "stage=dev" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate with AWS Credentials via OIDC
        if: steps.set-stage.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Serverless Deploy Execution
        if: steps.set-stage.outputs.deploy == 'true'
        uses: serverless/github-action@v3.2
        with:
          args: deploy --stage ${{ steps.set-stage.outputs.stage }}
          # Correct property to target path nesting within the Serverless Framework Runner Action
          working_directory: ./backend
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
