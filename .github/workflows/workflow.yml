name: frontend-workflow
run-name: ${{ github.actor }}-frontend-ci-${{ github.sha }}

on:
    pull_request:
        branches: ["develop"]
    push:
        branches: ["develop"]

permissions:
    contents: read
    pages: write
    id-token: write

jobs:

    changes-frontend:
        runs-on: ubuntu-latest
        outputs:
            frontend: ${{ steps.filter.outputs.frontend }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      frontend:
                          - 'frontend/**'
    frontend-ci:
        needs:
          - changes-frontend

        if: needs.changes-frontend.outputs.frontend == 'true'

        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: ./frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Build frontend
              run: npm run build

            - name: Upload frontend artifact
              uses: actions/upload-artifact@v4
              with:
                name: frontend-artifact
                path: ./frontend

    build-frontend-image:

        needs:
          - changes-frontend
          - frontend-ci

        if: needs.changes-frontend.outputs.frontend == 'true'

        runs-on: ubuntu-latest

        steps:
            - name: Download frontend artifact
              uses: actions/download-artifact@v4
              with:
                name: frontend-artifact
                path: ./frontend

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./frontend
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest
    changes-backend:
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.filter.outputs.backend }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      backend:
                          - 'backend/**'

    backend-ci:
        needs:
          - changes-backend

        if: needs.changes-backend.outputs.backend == 'true'

        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Upload backend artifact
              uses: actions/upload-artifact@v4
              with:
                name: backend-artifact
                path: ./backend

    build-backend-image:

        needs:
          - changes-backend
          - backend-ci

        if: needs.changes-backend.outputs.backend == 'true'

        runs-on: ubuntu-latest

        steps:
            - name: Download backend artifact
              uses: actions/download-artifact@v4
              with:
                name: backend-artifact
                path: ./backend

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

    frontend-deploy:
        needs:
          - build-frontend-image

        if: needs.build-frontend-image.result == 'success'

        runs-on: ubuntu-latest

        steps:
            - name: Install Railway CLI
              run: npm install -g @railway/cli

            - name: Redploy frontend to Railway
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway redeploy --service frontend --yes

    backend-deploy:
      needs:
        - build-backend-image

      if: needs.build-backend-image.result == 'success'

      runs-on: ubuntu-latest

      steps:
          - name: Install Railway CLI
            run: npm install -g @railway/cli

          - name: Redeploy backend to Railway
            env:
                RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
            run: railway redeploy --service backend --yes