name: frontend-workflow
run-name: ${{ github.actor }}-frontend-ci-${{ github.sha }}

on:
    pull_request:
        branches: ["develop"]
    push:
        branches: ["develop"]

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    frontend-ci:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: ./frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Build frontend
              run: npm run build

    frontend-deploy:
        runs-on: ubuntu-latest

        needs: frontend-ci

        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: ./frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Build frontend
              working-directory: ./frontend
              run: npm run build

            - name: Setup GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                path: ./frontend/dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4