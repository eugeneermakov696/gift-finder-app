name: Deploy Amazon Gift Registry Backend 

on:
push:
branches:
- main
- dev
pull_request:
branches:
- main 

### Permissions required for safe AWS OIDC federation (eliminates static AWS keys)

permissions:
id-token: write
contents: read 

jobs:
validate-and-deploy:
name: Validate, Test, and Deploy
runs-on: ubuntu-latest 

steps:
### 1. Checkout the project repository

* name: Checkout Repository
uses: actions/checkout@v4

### 2. Set up Node.js runtime environment

* name: Setup Node.js Runtime
uses: actions/setup-node@v4
with:
node-version: 18
cache: 'npm'

### 3. Clean install backend dependencies

* name: Install Project Dependencies
run: npm ci

### 4. Run automated test suites (Jest validation execution)

* name: Run Test Suites
run: npm test

### 5. Dynamically determine the deployment stage based on git branch context

* name: Set Deployment Target Stage
id: set-stage
run: |
if [ "${{ github.ref }}" = "refs/heads/main" ]; then
echo "stage=prod" >> $GITHUB_OUTPUT
else
echo "stage=dev" >> $GITHUB_OUTPUT
fi

### 6. Exchange GitHub Identity tokens for temporary AWS credentials via OIDC

* name: Authenticate with AWS Credentials via OIDC
uses: aws-actions/configure-aws-credentials@v4
with:
role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
aws-region: us-east-1

### 7. Execute Serverless Framework multi-stage environment deployment

* name: Serverless Deploy Execution
uses: serverless/github-action@v3.2
with:
args: deploy --stage ${{ steps.set-stage.outputs.stage }}
env:

### Optional: Only needed if using enterprise Serverless Framework dashboard accounts

SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}