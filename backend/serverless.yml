service: amazon-gift-backend 

plugins: 

* serverless-dynamodb-local # Spins up a local Java/Docker DynamoDB GUI/instance
* serverless-offline        # Emulates AWS Lambda and API Gateway locally

custom: 

### Configuration block for local database mocking

dynamodb:
stages:
- dev
start:
port: 8000
inMemory: true
migrate: true # Automatically creates your tables (GiftLists, Users) on startup
seed: true    # Optional: permits inserting mock json arrays on boot 

provider:
name: aws
runtime: nodejs18.x
stage: ${opt:stage, 'dev'}
region: us-east-1 

environment:
GIFT_LISTS_TABLE: ${self:service}-gift-lists-${self:provider.stage}
USERS_TABLE: ${self:service}-users-${self:provider.stage}
AMAZON_PA_API_KEY: ssm:/amazon-gift/${self:provider.stage}/pa-api-key
ITEM_CLAIMED_SNS_TOPIC_ARN: !Ref ItemClaimedTopic
ORDER_PROCESSING_SQS_QUEUE_URL: !Ref OrderProcessingQueue
# Dynamic flag to let code know it's running inside the offline simulator
IS_OFFLINE: ${env:IS_OFFLINE, 'false'} 

iamRoleStatements:
- Effect: Allow
Action:
- dynamodb:GetItem
- dynamodb:PutItem
- dynamodb:UpdateItem
- dynamodb:Query
- dynamodb:Scan
Resource:
- !GetAtt GiftListsTable.Arn
- !GetAtt UsersTable.Arn
- Effect: Allow
Action:
- sns:Publish
Resource:
- !Ref ItemClaimedTopic
- Effect: Allow
Action:
- sqs:SendMessage
Resource:
- !GetAtt OrderProcessingQueue.Arn 

functions:
addGiftItem:
handler: src/handlers/items.add
events:
- http:
path: lists/items
method: post
cors: true 

reserveGiftItem:
handler: src/handlers/items.reserve
events:
- http:
path: lists/items/reserve
method: patch
cors: true 

resources:
Resources:
GiftListsTable:
Type: AWS::DynamoDB::Table
Properties:
TableName: ${self:provider.environment.GIFT_LISTS_TABLE}
AttributeDefinitions:
- AttributeName: list_id
AttributeType: S
KeySchema:
- AttributeName: list_id
KeyType: HASH
BillingMode: PAY_PER_REQUEST 

UsersTable:
Type: AWS::DynamoDB::Table
Properties:
TableName: ${self:provider.environment.USERS_TABLE}
AttributeDefinitions:
- AttributeName: user_id
AttributeType: S
KeySchema:
- AttributeName: user_id
KeyType: HASH
BillingMode: PAY_PER_REQUEST

ItemClaimedTopic:
Type: AWS::SNS::Topic
Properties:
TopicName: ${self:service}-item-claimed-${self:provider.stage}

OrderProcessingQueue:
Type: AWS::SQS::Queue
Properties:
QueueName: ${self:service}-order-queue-${self:provider.stage}