service: amazon-gift-backend 

plugins: 

* serverless-dynamodb-local # Emulates a local DynamoDB instance
* serverless-offline        # Emulates AWS Lambda and API Gateway locally

custom:
stage: ${opt:stage, 'dev'} 

### Automatically resolves environment configuration profiles dynamically

config: ${file(./config/${self:custom.stage}.json)} 

### Configuration block for local database mocking and seeding

dynamodb:
stages:
- dev
start:
port: 8000
inMemory: true
migrate: true # Automatically provisions local tables on startup
seed: true    # Seeds data automatically on initialization
seed:
dev:
sources:
- table: ${self:provider.environment.GIFT_LISTS_TABLE}
sources: [./tests/seeds/giftListsSeed.json]
- table: ${self:provider.environment.USERS_TABLE}
sources: [./tests/seeds/usersSeed.json] 

provider:
name: aws
runtime: nodejs18.x
stage: ${self:custom.stage}
region: ${self:custom.config.AWS_REGION} 

### Global environment context variables loaded dynamically from configs and resource mappings

environment:
STAGE: ${self:custom.config.STAGE}
LOG_LEVEL: ${self:custom.config.LOG_LEVEL}
ENABLE_MOCK_FALLBACK: ${self:custom.config.ENABLE_MOCK_FALLBACK}
GIFT_LISTS_TABLE: ${self:service}-gift-lists-${self:provider.stage}
USERS_TABLE: ${self:service}-users-${self:provider.stage}
AMAZON_PA_API_KEY: ssm:/amazon-gift/${self:provider.stage}/pa-api-key
ITEM_CLAIMED_SNS_TOPIC_ARN: !Ref ItemClaimedTopic
ORDER_PROCESSING_SQS_QUEUE_URL: !Ref OrderProcessingQueue
IS_OFFLINE: ${env:IS_OFFLINE, 'false'} 

### Enforced Identity Access Management Principle of Least Privilege

iamRoleStatements:
- Effect: Allow
Action:
- dynamodb:GetItem
- dynamodb:PutItem
- dynamodb:UpdateItem
- dynamodb:Query
- dynamodb:Scan
Resource:
- !GetAtt GiftListsTable.Arn
- !GetAtt UsersTable.Arn
- Effect: Allow
Action:
- sns:Publish
Resource:
- !Ref ItemClaimedTopic
- Effect: Allow
Action:
- sqs:SendMessage
Resource:
- !GetAtt OrderProcessingQueue.Arn 

functions: 

### --- Item Management Handlers ---

addGiftItem:
handler: src/handlers/items.add
events:
- http:
path: lists/items
method: post
cors:
origin: ${self:custom.config.CORS_ALLOWED_ORIGINS} 

reserveGiftItem:
handler: src/handlers/items.reserve
events:
- http:
path: lists/items/reserve
method: patch
cors:
origin: ${self:custom.config.CORS_ALLOWED_ORIGINS} 

### --- Registry List Management Handlers ---

createGiftList:
handler: src/handlers/lists.create
events:
- http:
path: lists
method: post
cors:
origin: ${self:custom.config.CORS_ALLOWED_ORIGINS} 

getGiftList:
handler: src/handlers/lists.get
events:
- http:
path: lists/{listId}
method: get
cors:
origin: ${self:custom.config.CORS_ALLOWED_ORIGINS} 

resources:
Resources:
GiftListsTable:
Type: AWS::DynamoDB::Table
Properties:
TableName: ${self:provider.environment.GIFT_LISTS_TABLE}
AttributeDefinitions:
- AttributeName: list_id
AttributeType: S
KeySchema:
- AttributeName: list_id
KeyType: HASH
BillingMode: PAY_PER_REQUEST 

UsersTable:
Type: AWS::DynamoDB::Table
Properties:
TableName: ${self:provider.environment.USERS_TABLE}
AttributeDefinitions:
- AttributeName: user_id
AttributeType: S
KeySchema:
- AttributeName: user_id
KeyType: HASH
BillingMode: PAY_PER_REQUEST

ItemClaimedTopic:
Type: AWS::SNS::Topic
Properties:
TopicName: ${self:service}-item-claimed-${self:provider.stage}

OrderProcessingQueue:
Type: AWS::SQS::Queue
Properties:
QueueName: ${self:service}-order-queue-${self:provider.stage}