apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ .Release.Name }}-ingress
    namespace: {{ .Values.namespace }}
spec:
    ingressClassName: nginx
    rules:
        - http:
            paths:
                - pathType: Prefix
                  path: /gift-finder-app
                  backend:
                    service:
                        name: {{ .Values.namespace }}-frontend-service
                        port:
                            number: {{ .Values.frontend.deployment.port }}
        - http:
            paths:
                - pathType: Prefix
                  path: /swaagger
                  backend:
                    service:
                        name: {{ .Values.namespace }}-backend-service
                        port:
                            number: {{ .Values.backend.deployment.port }}