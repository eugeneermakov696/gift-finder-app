services:
  db:
    image: postgres:15-alpine
    container_name: django_postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=config
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=secure_dev_password_2026
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django_backend
    # Explicitly commented out volume mounts to bypass the 'C:\Mate academy' space bug
    # volumes:
    #   - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=config
      - DB_USER=postgres_user
      - DB_PASSWORD=secure_dev_password_2026
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db

# CRUCIAL: This global definition block was missing, causing your error!
volumes:
  postgres_data:
